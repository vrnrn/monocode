name: Mac release

on:
  workflow_dispatch:
  push:
    tags:
      - "mac-v*"

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'vrnrn/vorkspace'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Validate release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="mac-v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag must match the app version: $TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != tag && "$GITHUB_REF_NAME" != main ]]; then
            echo "Dispatch releases from main." >&2
            exit 1
          fi
          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            node - "$RUNNER_TEMP/release.json" <<'NODE'
          const release = require(process.argv[2]);
          if (!release.isDraft) throw new Error("Published releases cannot be overwritten");
          if (release.targetCommitish !== process.env.GITHUB_SHA) {
            throw new Error("An existing draft must belong to the same commit");
          }
          NODE
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - run: npm ci
      - run: node --test scripts/*.test.mjs
      - run: npm run check:web
      # Keep remote setup available for Apple Silicon and Intel Macs.
      - run: npm run test:host
      - name: Package Mac remote hosts
        run: |
          npm run host:build
          node host/package.mjs --target darwin-arm64
          node host/package.mjs --target darwin-x64

      # Apple ad hoc signing is separate from the mandatory updater signature.
      # This personal build does not require an Apple Developer certificate.
      - name: Build Apple Silicon app and upload draft
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MACOS_UPDATER_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "-"
          RUSTFLAGS: "-D warnings"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "vorkspace __VERSION__"
          releaseBody: "Personal Apple Silicon Mac build from vrnrn/vorkspace. Uses ad hoc Apple signing and signed in-app updates. See CHANGELOG.md for changes."
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Upload Mac host packages and migration helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            build/host-packages/vorkspace-host-darwin-{arm64,x64}.tar.gz \
            build/host-packages/vorkspace-host-darwin-{arm64,x64}.tar.gz.sha256 \
            scripts/migrate-monocode-to-vorkspace.sh LICENSE.vorkspace

      - name: Verify app and updater feed before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP="target/aarch64-apple-darwin/release/bundle/macos/vorkspace.app"
          codesign --verify --deep --strict "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/vorkspace")" = arm64
          test ! -e "$APP/Contents/Resources/Assets.car"
          if plutil -extract CFBundleIconName raw "$APP/Contents/Info.plist" >/dev/null 2>&1; then
            echo "App must use the original ICNS without a catalog override." >&2
            exit 1
          fi
          cmp src-tauri/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/feed"
          gh release view "$RELEASE_TAG" --json name,assets > "$RUNNER_TEMP/assets.json"
          node scripts/verify-macos-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/feed/latest.json" "$RUNNER_TEMP/assets.json"
          gh release edit "$RELEASE_TAG" --draft=false --latest
